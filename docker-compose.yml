services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: skillproof
      POSTGRES_USER: skillproof
      POSTGRES_PASSWORD: skillproof
    ports:
      - "5432:5432"
    volumes:
      - skillproof_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillproof -d skillproof"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  skillproof_data:
